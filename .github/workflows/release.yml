name: Build and Release BreakInv

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────
  # Windows — MSI installer (requires WiX 3.x)
  # WiX 3.11 is pre-installed on windows-latest
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Derive version from the git tag (v0.5.0 → 0.5.0)
      - name: Extract version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          "VERSION=$v" | Add-Content -Path $env:GITHUB_ENV

      - name: Build fat JAR
        run: mvn clean package

      - name: Copy JavaFX Windows modules to fx-mods
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path fx-mods | Out-Null
          $mods = @("javafx-controls", "javafx-graphics", "javafx-base", "javafx-fxml")
          foreach ($m in $mods) {
              Copy-Item "$env:USERPROFILE\.m2\repository\org\openjfx\$m\21.0.10\$m-21.0.10-win.jar" fx-mods\
          }

      - name: Create runtime image with jlink
        shell: pwsh
        run: >
          jlink
          --module-path "$env:JAVA_HOME/jmods;fx-mods"
          --add-modules java.base,java.sql,java.logging,java.desktop,java.xml,java.naming,jdk.unsupported,jdk.crypto.ec,javafx.controls,javafx.graphics,javafx.base,javafx.fxml
          --output jlink-runtime
          --no-header-files
          --no-man-pages
          --strip-debug
          --compress=2

      - name: Package with jpackage (MSI)
        shell: pwsh
        run: |
          jpackage `
            --input target/ `
            --main-jar "breakinv-$env:VERSION.jar" `
            --main-class com.daniel.main.App `
            --name BreakInv `
            --app-version $env:VERSION `
            --dest output/ `
            --type msi `
            --runtime-image jlink-runtime `
            --icon packaging/windows/BreakInv.ico `
            --vendor "DeD TechStack" `
            --description "BreakInv - desktop portfolio tracker for investments" `
            --copyright "Copyright 2026 DeD TechStack" `
            --java-options '-Dfile.encoding=UTF-8' `
            --win-menu `
            --win-shortcut `
            --win-menu-group BreakInv `
            --win-upgrade-uuid b72a4f3c-9e1d-4a2b-8c5d-f3e7a1b94d2e

          # ↑ IMPORTANT: do not change --win-upgrade-uuid after the first public release.
          #   Windows uses this GUID to recognise upgrades; changing it creates a new product
          #   that installs side-by-side instead of replacing the old version.

      - name: Rename artifact and generate SHA256
        shell: pwsh
        run: |
          $msi  = (Get-ChildItem output/ -Filter "*.msi" | Select-Object -First 1).FullName
          $dest = "output/BreakInv-$env:VERSION-windows-x64.msi"
          Rename-Item $msi $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$hash  BreakInv-$env:VERSION-windows-x64.msi" |
            Out-File -FilePath "output/BreakInv-$env:VERSION-windows-x64.msi.sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: BreakInv-windows
          path: output/

  # ─────────────────────────────────────────────
  # Linux — DEB package (requires fakeroot/dpkg)
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install DEB packaging tools
        run: sudo apt-get install -y fakeroot binutils

      # Derive version from the git tag (v0.5.0 → 0.5.0)
      - name: Extract version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build fat JAR
        run: mvn clean package

      - name: Copy JavaFX Linux modules to fx-mods
        run: |
          mkdir -p fx-mods
          find $HOME/.m2/repository/org/openjfx -name "*-21.0.10-linux.jar" -exec cp {} fx-mods/ \;

      - name: Create runtime image with jlink
        run: >
          jlink
          --module-path "$JAVA_HOME/jmods:fx-mods"
          --add-modules java.base,java.sql,java.logging,java.desktop,java.xml,java.naming,jdk.unsupported,jdk.crypto.ec,javafx.controls,javafx.graphics,javafx.base,javafx.fxml
          --output jlink-runtime
          --no-header-files
          --no-man-pages
          --strip-debug
          --compress=2

      - name: Package with jpackage (DEB)
        run: |
          jpackage \
            --input target/ \
            --main-jar "breakinv-${VERSION}.jar" \
            --main-class com.daniel.main.App \
            --name BreakInv \
            --app-version "$VERSION" \
            --dest output/ \
            --type deb \
            --runtime-image jlink-runtime \
            --icon packaging/linux/breakinv.png \
            --vendor "DeD TechStack" \
            --description "BreakInv - desktop portfolio tracker for investments" \
            --java-options '-Dfile.encoding=UTF-8' \
            --linux-app-category Finance \
            --linux-shortcut

      - name: Rename artifact and generate SHA256
        run: |
          deb=$(ls output/*.deb | head -1)
          dest="output/BreakInv-${VERSION}-linux-amd64.deb"
          mv "$deb" "$dest"
          sha256sum "$dest" > "output/BreakInv-${VERSION}-linux-amd64.deb.sha256"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: BreakInv-linux
          path: output/

  # ─────────────────────────────────────────────
  # Publish GitHub Release with both installers
  # and their SHA256 checksum files
  # ─────────────────────────────────────────────
  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BreakInv ${{ github.ref_name }}
          files: artifacts/**/*
